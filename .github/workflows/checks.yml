name: CI

on:
  push:
    # dev as well as main: a pull request can read the caches of its base branch, and the merged
    # dev should have been built by something before it is merged on into main.
    branches: [main, dev]
  pull_request:

# Read-only, said here so that it does not depend on what the repository's default is.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection asks for this job by name: renaming it takes it out of the merge gate.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/block-metadata.test.mjs scripts/docs-install.test.mjs
      # the documentation and the registry are generated: the types of what renders them depend on them
      - run: npm run docs
      - name: The registry is as committed
        # registry.json is written by scripts/build-registry.mjs and is what shadcn add reads from
        # GitHub; a component added without rebuilding it would be missing from the registry.
        run: git diff --exit-code registry.json
      - run: npm run typecheck
      - run: npm run build
